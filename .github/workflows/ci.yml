name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Build, Generate Data & Smoke Test
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python 3.11 ───────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Generate synthetic dataset ───────────────────────────────────────
      - name: Generate synthetic dataset
        run: python scripts/generate_synthetic_data.py

      # ── 5. Train demo model ─────────────────────────────────────────────────
      - name: Train demo model
        run: python scripts/create_demo_model.py

      # ── 6. Smoke tests ──────────────────────────────────────────────────────
      - name: Run smoke tests
        run: python scripts/smoke_test_ci.py

      # ── 7. pytest (unit + integration, no live server required) ─────────────
      - name: Run pytest
        run: pytest scripts/test_backend.py -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install flake8

      - name: Lint with flake8
        run: |
          # Stop the build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=.venv,node_modules,dashboard/frontend
          # Warn on style issues (do not fail the build)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 \
            --statistics --exclude=.venv,node_modules,dashboard/frontend
