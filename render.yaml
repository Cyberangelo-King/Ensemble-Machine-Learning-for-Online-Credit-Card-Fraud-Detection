services:
  # Backend Service (FastAPI)
  - type: web
    name: fraud-api
    env: python
    buildCommand: pip install -r requirements.txt && python scripts/generate_synthetic_data.py && python src/run_experiment.py
    startCommand: uvicorn dashboard.backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*" # Set this to your frontend URL later for better security

  # Frontend Service (React)
  - type: web
    name: fraud-dashboard
    env: node
    buildCommand: cd dashboard/frontend && npm install && npm run build
    staticPublishPath: dashboard/frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: fraud-api
          type: web
          property: host
      - key: VITE_WS_URL
        fromService:
          name: fraud-api
          type: web
          property: host
